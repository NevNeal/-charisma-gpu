[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charisma-gpu"
version = "0.1.0"
description = "The charisma colour-classification pipeline (R package charisma) in PyTorch, batched for GPUs"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
charisma-gpu = "charisma_gpu.cli:main"

[tool.setuptools]
packages = ["charisma_gpu"]

[tool.setuptools.package-data]
charisma_gpu = ["cluts/*.csv"]
